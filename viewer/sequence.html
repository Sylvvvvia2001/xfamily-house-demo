<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S01 · Daily sequence</title><style>body{max-width:60rem;margin:3rem auto;padding:0 1rem;font:16px/1.5 system-ui;color:#26332e}a{color:#235d49}summary{cursor:pointer;padding:.55rem 0}li{margin:.3rem 0}time{font-variant-numeric:tabular-nums}</style><a href="./index.html" id="back">House playback</a><h1>Daily sequence</h1><main></main><script type="module">
import './assets.js';
const who=new URLSearchParams(location.search).get('participant')||'S01';
const date=new URLSearchParams(location.search).get('date'), c=await fetch('day-catalog.json').then(r=>r.json()),day=[...Object.values(c.days),...c.additionalDates].find(d=>d.date===date && d.participant===who)??c.days.S01;
const url=t=>'index.html?participant='+who+'&date='+day.date+(t==null?'':'&t='+t);
document.querySelector('#back').href=url(null);document.querySelector('h1').textContent=who+' · '+day.date;
const get=f=>fetch(day.base+'days/'+who+'/'+f+'.json').then(r=>r.json());const [data,m,pauses,rest]=await Promise.all([get('timeline'),get('motion'),get('short-pauses'),day.restTransitions?fetch(day.restTransitions).then(r=>r.json()):{}]);const replacements=new Map(pauses.edits.map(e=>[e.original,e.segments]));const segments=m.segments.flatMap(s=>replacements.get(s.id)||[s]);
const clock=t=>new Date(t*1000).toISOString().slice(11,19);
for(const a of data.activities){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=clock(a.t0)+' – '+clock(a.t1)+' · '+a.label;d.append(s);d.addEventListener('toggle',()=>{if(!d.open||d.children.length>1)return;const l=document.createElement('ul');for(const step of segments.filter(x=>x.start<a.t1&&x.end>a.t0)){const b=document.createElement('a');b.href=url(step.start);b.textContent=clock(step.start)+' · '+(rest?.bindings?.[step.id]?.title||step.title);const li=document.createElement('li');li.append(b);l.append(li)}d.append(l)});document.querySelector('main').append(d)}
const logs=document.createElement('details');logs.id='devices';const ls=document.createElement('summary');ls.textContent='Device events · '+data.logs.length;logs.append(ls);const ul=document.createElement('ul');for(const e of data.logs){const li=document.createElement('li'),b=document.createElement('a');b.href=url(e.t);b.textContent=clock(e.t)+' · '+e.deviceLabel+' · '+e.action;li.append(b);ul.append(li)}logs.append(ul);document.querySelector('main').append(logs);if(location.hash==='#devices'){logs.open=true;logs.scrollIntoView()}
</script></html>
